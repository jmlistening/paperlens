name: PaperLens offline CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal offline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Run tests/ suite
        run: python -m unittest discover -s tests -v
      - name: Run root eval tests
        run: python -m unittest discover -s . -p "test_eval.py" -v
